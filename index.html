<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鼠标轨迹应用</title>
    <style>
        /* 拟态风格基础设置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* 拟态风格核心变量 */
        :root {
            --bg-color: #e0e0e0;
            --text-color: #555;
            --shadow-light: #ffffff;
            --shadow-dark: #bebebe;
            --border-radius: 12px;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg-color);
            margin: 0;
            padding: 0;
            overflow: hidden;
            color: var(--text-color);
        }
        
        .container {
            width: 100%;
            height: 100vh;
            background: var(--bg-color);
            position: relative;
            overflow: hidden;
        }
        
        /* 全屏canvas轨迹 - 置于顶层 */
        #mainCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* 允许鼠标事件穿透到下层元素 */
            z-index: 9999; /* 最高层级，确保显示在所有元素之上 */
        }
        
        /* 内容区域层级设置 */
        .header,
        .content {
            position: relative;
            z-index: 1; /* 内容区域位于底层，轨迹在顶层 */
        }
        
        .header {
            background: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            text-align: center;
            position: relative;
            -webkit-app-region: drag;
        }
        
        /* 窗口控制按钮 - 拟态风格 */
        .window-controls {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 8px;
            z-index: 100;
        }
        
        .window-btn {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            padding: 0;
            -webkit-app-region: no-drag;
            background: var(--bg-color);
            box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
            color: var(--text-color);
        }
        
        .window-btn.minimize:hover {
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
        }
        
        .window-btn.close {
            color: #ff5252;
        }
        
        .window-btn.close:hover {
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
        }
        
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin: 0;
            color: var(--text-color);
        }
        
        /* 内容区域 - 拟态风格 */
        .content {
            padding: 0 24px 24px;
            background: var(--bg-color);
            border-radius: 30px 30px 0 0;
            height: calc(100% - 80px);
            overflow-y: auto;
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        
        /* 隐藏滚动条 */
        .content::-webkit-scrollbar {
            display: none;
        }
        
        /* 控制组 - 拟态风格 */
        .control-group {
            margin-bottom: 20px;
            padding: 16px;
            background: var(--bg-color);
            border-radius: var(--border-radius);
            box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
        }
        
        .control-group:last-child {
            margin-bottom: 0;
        }
        
        .control-label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-color);
            font-weight: 500;
            font-size: 14px;
        }
        
        /* 自定义滑块样式 - 拟态风格 */
        input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: var(--bg-color);
            outline: none;
            appearance: none;
            -webkit-appearance: none;
            margin: 12px 0;
            box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light);
        }
        
        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--bg-color);
            cursor: pointer;
            box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
            transition: all 0.2s ease;
        }
        
        input[type="range"]::-webkit-slider-thumb:hover {
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
        }
        
        input[type="range"]::-moz-range-thumb {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--bg-color);
            cursor: pointer;
            border: none;
            box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
            transition: all 0.2s ease;
        }
        
        input[type="range"]::-moz-range-thumb:hover {
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
        }
        
        /* 开关样式 - 拟态风格 */
        .toggle-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            background: var(--bg-color);
            border-radius: var(--border-radius);
            box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
            margin-bottom: 20px;
        }
        
        .toggle-item:last-child {
            margin-bottom: 0;
        }
        
        .toggle-label {
            display: flex;
            align-items: center;
            font-weight: 500;
            color: var(--text-color);
            cursor: pointer;
        }
        
        /* 拟态风格的开关按钮 */
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 52px;
            height: 28px;
        }
        
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-color);
            transition: .3s;
            border-radius: 28px;
            box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light);
        }
        
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 4px;
            bottom: 4px;
            background: var(--bg-color);
            transition: .3s;
            border-radius: 50%;
            box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
        }
        
        input:checked + .toggle-slider {
            background: var(--bg-color);
            box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light);
        }
        
        input:focus + .toggle-slider {
            box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light);
        }
        
        input:checked + .toggle-slider:before {
            transform: translateX(24px);
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
        }
        
        /* 颜色选择器样式 - 拟态风格 */
        .color-picker-container {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        input[type="color"] {
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: var(--bg-color);
            padding: 4px;
            overflow: hidden;
            box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
        }
        
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        
        input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 8px;
            box-shadow: 2px 2px 5px var(--shadow-dark), -2px -2px 5px var(--shadow-light);
        }
        
        /* 模式选择器样式 - 拟态风格 */
        .mode-selector {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }
        
        .mode-option {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 10px 16px;
            border-radius: 10px;
            background: var(--bg-color);
            transition: all 0.2s ease;
            box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
        }
        
        .mode-option:hover {
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
        }
        
        .mode-option input[type="radio"] {
            accent-color: var(--text-color);
        }
        
        .mode-option input[type="radio"]:checked + span {
            font-weight: 600;
            color: var(--text-color);
        }
        
        /* 渐变颜色选择器样式 - 拟态风格 */
        .gradient-colors {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-top: 12px;
        }
        
        .gradient-color-item {
            display: flex;
        }
        
        .color-block {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--bg-color);
            border-radius: 10px;
            box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
        }
        
        .color-block input[type="color"] {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: var(--bg-color);
            padding: 2px;
            overflow: hidden;
        }
        
        /* 渐变颜色控制按钮 - 拟态风格 */
        #addColorBtnWrapper {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #addColorBtn {
            width: 40px;
            height: 40px;
            padding: 0;
            font-size: 24px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-color);
            color: var(--text-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
            border: none;
        }
        
        #addColorBtn:hover {
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
        }
        
        #addColorBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* Header样式调整 */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .header-toggle {
            margin: 0 16px;
        }
        
        .remove-color-btn {
            width: 32px;
            height: 32px;
            padding: 0;
            font-size: 16px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-color);
            color: #ff5252;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
        }
        
        .remove-color-btn:hover {
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
        }
        
        .remove-color-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* 预设模板样式 - 拟态风格 */
        .preset-templates {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 16px;
            margin-top: 12px;
        }
        
        .preset-template {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 16px;
            border-radius: 10px;
            background: var(--bg-color);
            transition: all 0.2s ease;
            box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
        }
        
        .preset-template:hover {
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
        }
        
        .preset-preview {
            width: 80px;
            height: 40px;
            border-radius: 8px;
            background: var(--bg-color);
            box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
        }
        
        /* 实时预览区域 - 拟态风格 */
        .preview-area {
            margin-top: 20px;
            padding: 20px;
            background: var(--bg-color);
            border-radius: var(--border-radius);
            text-align: center;
            box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
        }
        
        .preview-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 12px;
        }
        
        #previewCanvas {
            width: 100%;
            height: 150px;
            border-radius: 10px;
            background: var(--bg-color);
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
            cursor: crosshair;
        }
        
        /* 数值显示 */
        .value-display {
            float: right;
            color: var(--text-color);
            font-weight: 600;
            font-size: 14px;
        }
        
        /* 按钮样式 - 拟态风格 */
        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 28px;
        }
        
        button {
            padding: 14px;
            border: none;
            border-radius: var(--border-radius);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: var(--bg-color);
            color: var(--text-color);
            box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
        }
        
        button#minimizeWindow {
            background: var(--bg-color);
            color: var(--text-color);
        }
        
        button#minimizeWindow:hover {
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
        }
        
        button#quitApp {
            background: var(--bg-color);
            color: var(--text-color);
        }
        
        button#quitApp:hover {
            background: var(--bg-color);
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
        }
        
        .parameter-container {
            margin-top: 16px;
        }
        
        /* 改进的开关样式，增强可见性 */
        .toggle-switch input:checked + .toggle-slider {
            background: var(--bg-color);
            box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light), inset 0 0 0 14px rgba(76, 175, 80, 0.7);
        }
        
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 4px;
            bottom: 4px;
            background: var(--bg-color);
            transition: .3s;
            border-radius: 50%;
            box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
        }
        
        input:checked + .toggle-slider:before {
            transform: translateX(24px);
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
            background: #4CAF50;
        }
        
        /* 拟态风格自定义下拉选择框 */
        .custom-select {
            position: relative;
            width: 100%;
        }
        
        .custom-select select {
            width: 100%;
            padding: 12px;
            border-radius: var(--border-radius);
            border: none;
            background: var(--bg-color);
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
            color: var(--text-color);
            font-size: 14px;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg xmlns='http://www.w3.org/2000/svg' width='292.4' height='292.4'%3E%3Cpath fill='%23555555' d='M287 69.4a17.6 17.6 0 0 0-13-5.4H18.4c-5 0-9.3 1.8-12.9 5.4A17.6 17.6 0 0 0 0 82.2c0 5 1.8 9.3 5.4 12.9l128 127.9c3.6 3.6 7.8 5.4 12.8 5.4s9.2-1.8 12.8-5.4L287 95c3.5-3.5 5.4-7.8 5.4-12.8 0-5-1.9-9.2-5.5-12.8z'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 12px;
        }
        
        .custom-select select:hover {
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
        }
        
        .custom-select select:focus {
            box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light), 0 0 0 2px rgba(0, 0, 0, 0.1);
        }
        
        /* 由于浏览器限制，option元素样式有限制，我们使用自定义样式来尽量匹配拟态风格 */
        .custom-select select option {
            background-color: var(--bg-color) !important;
            color: var(--text-color) !important;
            padding: 12px !important;
            margin: 2px 0 !important;
            border-radius: var(--border-radius) !important;
            outline: none !important;
        }
        
        /* WebKit浏览器特定样式 */
        @-moz-document url-prefix() {
            .custom-select select option {
                background-color: var(--bg-color) !important;
                color: var(--text-color) !important;
            }
        }
        
        /* 移除默认的下拉箭头样式 */
        select::-ms-expand {
            display: none;
        }
        
        /* 自定义下拉框容器，用于完全控制样式 */
        .custom-dropdown {
            position: relative;
            width: 100%;
            margin-top: 8px;
        }
        
        .dropdown-selected {
            padding: 12px;
            border-radius: var(--border-radius);
            background: var(--bg-color);
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
            color: var(--text-color);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .dropdown-selected:hover {
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
        }
        
        .dropdown-arrow {
            width: 12px;
            height: 12px;
            transition: transform 0.2s ease;
        }
        
        .dropdown-arrow.open {
            transform: rotate(180deg);
        }
        
        .dropdown-menu {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            margin-top: 8px;
            background: var(--bg-color);
            border-radius: var(--border-radius);
            box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }
        
        .dropdown-menu.open {
            display: block;
        }
        
        .dropdown-item {
            padding: 12px 16px;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s ease;
            border-radius: var(--border-radius);
            margin: 4px;
        }
        
        .dropdown-item:hover {
            background: var(--bg-color);
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
        }
        
        .dropdown-item.selected {
            background: var(--bg-color);
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
            font-weight: 600;
        }
        
        /* 模式设置面板 */
        .mode-settings {
            margin-top: 16px;
        }
        
        /* 当前颜色显示 */
        #currentColor {
            color: var(--text-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 全屏轨迹canvas -->
        <canvas id="mainCanvas"></canvas>
        
        <div class="header">
            <h1>Curove</h1>
            <div class="toggle-item header-toggle" style="margin-bottom: 0; box-shadow: none; -webkit-app-region: no-drag;">
                <label class="toggle-switch">
                    <input type="checkbox" id="trailEnabled" checked>
                    <span class="toggle-slider"></span>
                </label>
            </div>
            <div class="window-controls">
                <button class="window-btn minimize" id="minimizeBtn">—</button>
                <button class="window-btn close" id="closeBtn">×</button>
            </div>
        </div>
        
        <div class="content">
        
        <!-- 路径模式切换 -->
        <div class="control-group">
            <label class="control-label">路径模式</label>
            <div class="mode-selector">
                <label class="mode-option">
                    <input type="radio" name="trailMode" value="single" id="modeSingle">
                    <span>单色</span>
                </label>
                <label class="mode-option">
                    <input type="radio" name="trailMode" value="gradient" id="modeGradient">
                    <span>渐变</span>
                </label>
                <label class="mode-option">
                    <input type="radio" name="trailMode" value="preset" id="modePreset">
                    <span>预设</span>
                </label>
            </div>
        </div>
        
        <!-- 单色模式设置 -->
        <div id="singleColorSettings" class="mode-settings" style="display: none;">
            <div class="control-group">
                <label class="control-label">轨迹颜色</label>
                <div class="color-picker-container">
                    <input type="color" id="trailColor" value="#ff0000">
                    <span id="currentColor">#ff0000</span>
                </div>
            </div>
            
            <!-- 通用设置 -->
            <div class="control-group parameter-container">
                <label class="control-label">

                <label class="control-label" style="margin-top: 16px;">
                    轨迹宽度 <span class="value-display" id="trailWidthValue">5</span>
                </label>
                <input type="range" id="trailWidth" min="1" max="20" value="5">
                
                <label class="control-label" style="margin-top: 16px;">
                    轨迹透明度 <span class="value-display" id="trailOpacityValue">0.8</span>
                </label>
                <input type="range" id="trailOpacity" min="0.1" max="1" step="0.1" value="0.8">
                
                <label class="control-label" style="margin-top: 16px;">
                    停留时间 <span class="value-display" id="trailFadeTimeValue">1000</span>ms

        <!-- 预设模式设置 -->
        <div id="presetSettings" class="mode-settings" style="display: none;">

                        </svg>
                    </div>
                    <div class="dropdown-menu" id="dropdownMenu">
                        <div class="dropdown-item" data-value="0" id="presetItem0" class="selected">模板 1</div>
                        <div class="dropdown-item" data-value="1" id="presetItem1">模板 2</div>
                        <div class="dropdown-item" data-value="2" id="presetItem2">模板 3</div>
                        <div class="dropdown-item" data-value="3" id="presetItem3">模板 4</div>
                        <div class="dropdown-item" data-value="4" id="presetItem4">模板 5</div>

</div>
    
    <script>
        const { ipcRenderer, remote } = require('electron');
        
        // 获取DOM元素
        const trailEnabled = document.getElementById('trailEnabled');
        const trailWidth = document.getElementById('trailWidth');
        const trailWidthValue = document.getElementById('trailWidthValue');
        const trailOpacity = document.getElementById('trailOpacity');
        const trailOpacityValue = document.getElementById('trailOpacityValue');
        const trailFadeTime = document.getElementById('trailFadeTime');
        const trailFadeTimeValue = document.getElementById('trailFadeTimeValue');
        const trailColor = document.getElementById('trailColor');
        const minimizeBtn = document.getElementById('minimizeBtn');
        const closeBtn = document.getElementById('closeBtn');
        const currentColor = document.getElementById('currentColor');
        
        // 渐变控制元素
        const gradientLength = document.getElementById('gradientLength');
        const gradientLengthValue = document.getElementById('gradientLengthValue');
        const gradientTransition = document.getElementById('gradientTransition');
        const gradientTransitionValue = document.getElementById('gradientTransitionValue');
        
        // 模式切换元素
        const modeSingle = document.getElementById('modeSingle');
        const modeGradient = document.getElementById('modeGradient');
        const modePreset = document.getElementById('modePreset');
        const singleColorSettings = document.getElementById('singleColorSettings');
        const gradientSettings = document.getElementById('gradientSettings');
        const presetSettings = document.getElementById('presetSettings');
        const presetSelect = document.getElementById('presetSelect');
        
        // 渐变颜色元素
        const gradientColors = document.querySelectorAll('.gradient-color');
        const addColorBtn = document.getElementById('addColorBtn');
        const gradientColor3 = document.getElementById('gradientColor3');
        const gradientColor4 = document.getElementById('gradientColor4');
        
        // 轨迹设置
        let trailSettings = {
            enabled: true,
            mode: 'single', // 模式：single, gradient, preset
            width: 5,
            opacity: 0.8,
            fadeTime: 1000, // 停留时间（毫秒）
            color: '#ff0000', // 单色模式颜色
            gradientColors: ['#ff0000', '#00ff00'], // 渐变模式颜色
            preset: 0, // 预设模式模板索引
            gradientLength: 100, // 渐变长度
            gradientTransition: 0.5 // 渐变过渡程度（0-1）
        };
        
        // 获取主canvas元素
        const mainCanvas = document.getElementById('mainCanvas');
        const ctx = mainCanvas.getContext('2d');
        
        // 设置canvas实际宽高（与显示宽高一致）
        function resizeCanvas() {
            const rect = mainCanvas.getBoundingClientRect();
            mainCanvas.width = rect.width * window.devicePixelRatio;
            mainCanvas.height = rect.height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }
        
        // 初始化canvas
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // 鼠标轨迹点数组
        let mouseTrail = [];
        let animationFrameId = null;
        let lastMouseMoveTime = 0;
        let totalPointsGenerated = 0; // 用于跟踪生成的点的总数，确保颜色序列一致
        
        // 上一个鼠标位置
        let lastMousePos = null;
        
        // 计算轨迹点的固定颜色，在创建时分配，不再改变
        function calculateFixedColor() {
            if (trailSettings.mode !== 'gradient' || !trailSettings.gradientColors || trailSettings.gradientColors.length < 2) {
                return trailSettings.color;
            }
            
            // 实现沿轨迹的单一渐变，从第一个颜色到最后一个颜色
            // 每个点根据其在轨迹中的位置获得唯一颜色
            // 使用总生成点计数作为沿渐变的位置
            const positionInGradient = totalPointsGenerated % trailSettings.gradientLength;
            const normalizedPosition = positionInGradient / trailSettings.gradientLength;
            
            const colorCount = trailSettings.gradientColors.length;
            
            // 计算在颜色数组中的位置（非循环）
            const positionInArray = normalizedPosition * (colorCount - 1);
            
            // 获取当前颜色索引和下一个颜色索引
            const startIndex = Math.floor(positionInArray);
            const endIndex = Math.min(startIndex + 1, colorCount - 1);
            
            // 计算过渡比例
            let transitionRatio = positionInArray - startIndex;
            
            // 使用 gradientTransition 来调整过渡效果
            if (trailSettings.gradientTransition > 0) {
                transitionRatio = easeInOutCubic(transitionRatio, trailSettings.gradientTransition);
            }
            
            // 获取起始颜色和结束颜色
            const startColorHex = trailSettings.gradientColors[startIndex];
            const endColorHex = trailSettings.gradientColors[endIndex];
            
            // 获取起始颜色和结束颜色的RGB值
            const startColor = hexToRgb(startColorHex);
            const endColor = hexToRgb(endColorHex);
            
            // 线性插值计算当前颜色
            const r = Math.round(startColor.r + (endColor.r - startColor.r) * transitionRatio);
            const g = Math.round(startColor.g + (endColor.g - startColor.g) * transitionRatio);
            const b = Math.round(startColor.b + (endColor.b - startColor.b) * transitionRatio);
            
            // 转换回十六进制格式
            return rgbToHex(r, g, b);
        }
        
        // 缓动函数，用于调整渐变过渡效果
        function easeInOutCubic(t, transition) {
            // transition 值越大，过渡越平滑
            const smoothness = 1 + transition * 3;
            return t < 0.5 
                ? Math.pow(2 * t, smoothness) / 2 
                : 1 - Math.pow(-2 * t + 2, smoothness) / 2;
        }
        
        // 鼠标移动事件（整个窗口）
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX;
            const y = e.clientY;
            
            // 递增总生成点计数
            totalPointsGenerated++;
            
            // 为当前点计算固定颜色
            const pointColor = calculateFixedColor();
            
            const currentPos = { 
                x, 
                y, 
                createdAt: Date.now(), // 记录点的生成时间
                color: pointColor // 为当前点分配固定颜色
            };
            
            // 添加当前点
            mouseTrail.push(currentPos);
            
            // 如果有上一个位置，且距离较远，添加中间点以确保轨迹连续
            if (lastMousePos) {
                const dx = currentPos.x - lastMousePos.x;
                const dy = currentPos.y - lastMousePos.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                // 如果距离大于10像素，添加中间点
                const maxDistance = 10;
                if (distance > maxDistance) {
                    const steps = Math.ceil(distance / maxDistance);
                    const stepX = dx / steps;
                    const stepY = dy / steps;
                    
                    // 添加中间点
                    for (let i = 1; i < steps; i++) {
                        // 递增总生成点计数
                        totalPointsGenerated++;
                        
                        // 为每个中间点也分配固定颜色
                        const intermediateColor = calculateFixedColor();
                        mouseTrail.push({
                            x: lastMousePos.x + stepX * i,
                            y: lastMousePos.y + stepY * i,
                            createdAt: Date.now(),
                            color: intermediateColor // 为中间点分配固定颜色
                        });
                    }
                }
            }
            
            // 更新上一个位置
            lastMousePos = currentPos;
        });
        
        // 连续动画循环，持续更新轨迹
        function animateTrail() {
            cleanupOldPoints();
            drawSmoothTrail();
            requestAnimationFrame(animateTrail);
        }
        
        // 定期清理过期的轨迹点
        // 实现固定速度淡化：同样长的时间内只能淡化同样长度的轨迹，不受鼠标移动速度影响
        function cleanupOldPoints() {
            const timeInterval = 50; // 清理间隔（毫秒）
            
            // 计算淡化速度：根据用户设置的停留时间，确保轨迹在设定时间内完全淡化
            // 使用当前轨迹点数量和停留时间计算每秒应淡化的点数
            const fadeSpeed = mouseTrail.length / (trailSettings.fadeTime / 1000);
            
            // 计算在当前时间间隔内应该淡化的点数量
            const pointsToRemove = Math.max(1, Math.floor(fadeSpeed * timeInterval / 1000));
            
            // 如果有足够的点，按固定速度移除最老的点
            if (mouseTrail.length > pointsToRemove) {
                // 按创建时间排序，确保最老的点在前面
                mouseTrail.sort((a, b) => a.createdAt - b.createdAt);
                // 移除最老的点
                mouseTrail = mouseTrail.slice(pointsToRemove);
            } else if (mouseTrail.length > 0) {
                // 如果点数不足，清空所有点
                mouseTrail = [];
            }
        }
        
        // 启动动画循环
        animateTrail();
        
        // 平滑绘制轨迹（使用贝塞尔曲线）
        function drawSmoothTrail() {
            // 清空画布
            ctx.clearRect(0, 0, mainCanvas.width / window.devicePixelRatio, mainCanvas.height / window.devicePixelRatio);
            
            if (!trailSettings.enabled || mouseTrail.length < 2) {
                return;
            }
            
            // 按创建时间排序轨迹点，确保顺序正确（最早的点在前面，最新的点在后面）
            const sortedPoints = [...mouseTrail].sort((a, b) => a.createdAt - b.createdAt);
            
            if (sortedPoints.length < 2) {
                return;
            }
            
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = trailSettings.width; // 使用固定宽度，不随时间变化
            
            // 遍历所有点，绘制从尾部到头部的轨迹
            for (let i = 0; i < sortedPoints.length - 1; i++) {
                // 计算当前线段在轨迹中的位置比例（从尾部到头部）
                // i = 0 是最老的点（尾部），i = sortedPoints.length - 2 是最新的点（头部）
                const trailProgress = i / (sortedPoints.length - 1);
                
                // 计算当前线段的透明度：尾部完全透明，头部完全不透明
                const alpha = trailSettings.opacity * trailProgress;
                
                // 跳过几乎透明的线段
                if (alpha < 0.05) continue;
                
                // 使用轨迹点的固定颜色
                const prev = sortedPoints[i];     // 前一个点（更靠近尾部）
                const curr = sortedPoints[i + 1]; // 当前点（更靠近头部）
                const segmentColor = curr.color || trailSettings.color;
                
                // 设置当前线段的样式
                ctx.strokeStyle = `${segmentColor}${Math.floor(alpha * 255).toString(16).padStart(2, '0')}`;
                
                // 绘制当前线段
                ctx.beginPath();
                
                ctx.moveTo(prev.x, prev.y);
                
                if (i < sortedPoints.length - 2) {
                    // 不是最后一个线段，使用贝塞尔曲线
                    const next = sortedPoints[i + 2];
                    
                    // 计算控制点，实现平滑曲线
                    const tension = 0.5;
                    const cp1x = curr.x - (next.x - prev.x) * tension;
                    const cp1y = curr.y - (next.y - prev.y) * tension;
                    const cp2x = curr.x + (next.x - prev.x) * tension;
                    const cp2y = curr.y + (next.y - prev.y) * tension;
                    
                    ctx.bezierCurveTo(curr.x, curr.y, cp2x, cp2y, next.x, next.y);
                } else {
                    // 最后一个线段，直接连线
                    ctx.lineTo(curr.x, curr.y);
                }
                
                ctx.stroke();
            }
        }
        
        // 根据渐变颜色数组和位置计算当前颜色
        function getGradientColor(gradientColors, position) {
            if (!gradientColors || gradientColors.length < 2) {
                return gradientColors[0] || '#ff0000';
            }
            
            // 计算当前位置落在哪个颜色区间
            const colorIndex = Math.floor(position * (gradientColors.length - 1));
            const nextColorIndex = Math.min(colorIndex + 1, gradientColors.length - 1);
            
            // 计算在当前区间内的相对位置
            const intervalPosition = (position * (gradientColors.length - 1)) - colorIndex;
            
            // 获取起始颜色和结束颜色
            const startColor = hexToRgb(gradientColors[colorIndex]);
            const endColor = hexToRgb(gradientColors[nextColorIndex]);
            
            // 线性插值计算当前颜色
            const r = Math.round(startColor.r + (endColor.r - startColor.r) * intervalPosition);
            const g = Math.round(startColor.g + (endColor.g - startColor.g) * intervalPosition);
            const b = Math.round(startColor.b + (endColor.b - startColor.b) * intervalPosition);
            
            // 转换回十六进制格式
            return rgbToHex(r, g, b);
        }
        
        // 十六进制颜色转RGB
        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : { r: 255, g: 0, b: 0 };
        }
        
        // RGB颜色转十六进制
        function rgbToHex(r, g, b) {
            return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
        }
        
        // 更新当前颜色显示
        function updateColorDisplay() {
            currentColor.textContent = trailSettings.color;
        }
        
        // 更新轨迹设置
        function updateSettings() {
            trailSettings = {
                enabled: trailEnabled.checked,
                mode: document.querySelector('input[name="trailMode"]:checked').value,
                width: parseInt(trailWidth.value),
                opacity: parseFloat(trailOpacity.value),
                fadeTime: parseInt(trailFadeTime.value),
                color: trailColor.value,
                gradientColors: trailSettings.gradientColors || ['#ff0000', '#00ff00'],
                preset: trailSettings.preset || 0,
                gradientLength: parseInt(gradientLength.value),
                gradientTransition: parseFloat(gradientTransition.value)
            };
            
            // 更新显示值
            trailWidthValue.textContent = trailSettings.width;
            trailOpacityValue.textContent = trailSettings.opacity;
            trailFadeTimeValue.textContent = trailSettings.fadeTime;
            gradientLengthValue.textContent = trailSettings.gradientLength;
            gradientTransitionValue.textContent = trailSettings.gradientTransition;
            updateColorDisplay();
            
            // 更新轨迹
            drawSmoothTrail();
            
            // 发送配置到主进程
            ipcRenderer.send('update-trail-config', trailSettings);
            
            // 发送开关状态到主进程
            ipcRenderer.send('toggle-trail', trailSettings.enabled);
        }
        
        // 模式切换事件处理
        function handleModeChange() {
            const selectedMode = document.querySelector('input[name="trailMode"]:checked').value;
            trailSettings.mode = selectedMode;
            
            // 显示对应的设置面板
            singleColorSettings.style.display = selectedMode === 'single' ? 'block' : 'none';
            gradientSettings.style.display = selectedMode === 'gradient' ? 'block' : 'none';
            presetSettings.style.display = selectedMode === 'preset' ? 'block' : 'none';
            
            // 直接发送当前配置，不需要重新生成，避免使用默认值
            ipcRenderer.send('update-trail-config', trailSettings);
            ipcRenderer.send('toggle-trail', trailSettings.enabled);
            drawSmoothTrail();
        }
        
        // 渐变颜色变化处理
        function handleGradientColorChange() {
            const colors = Array.from(document.querySelectorAll('.gradient-color'))
                .filter(colorInput => {
                    // 只包含可见的颜色输入
                    return colorInput.closest('.gradient-color-item').style.display !== 'none';
                })
                .map(colorInput => colorInput.value);
            
            trailSettings.gradientColors = colors;
            updateSettings();
        }
        
        // 添加渐变颜色
        function addGradientColor() {
            const visibleColors = document.querySelectorAll('.gradient-color-item:not([style*="display: none"])');
            const count = visibleColors.length;
            
            if (count < 5) { // 包括添加按钮
                if (count === 3) { // 2个颜色 + 1个添加按钮
                    gradientColor3.style.display = 'flex';
                } else if (count === 4) { // 3个颜色 + 1个添加按钮
                    gradientColor4.style.display = 'flex';
                }
                
                // 更新按钮状态
                updateGradientButtons();
                handleGradientColorChange();
            }
        }
        
        // 移除渐变颜色
        function removeGradientColor(index = null) {
            const visibleColors = document.querySelectorAll('.gradient-color-item:not([style*="display: none"])');
            const count = visibleColors.length;
            
            if (count > 2) {
                let elementToHide = null;
                
                if (index !== null && index >= 2) {
                    // 如果指定了索引且索引大于等于2，根据索引隐藏对应元素
                    if (index === 2) {
                        elementToHide = gradientColor3;
                    } else if (index === 3) {
                        elementToHide = gradientColor4;
                    }
                } else {
                    // 否则隐藏最后一个可见元素
                    if (count === 4) {
                        elementToHide = gradientColor4;
                    } else if (count === 3) {
                        elementToHide = gradientColor3;
                    }
                }
                
                if (elementToHide) {
                    elementToHide.style.display = 'none';
                    
                    // 更新按钮状态
                    updateGradientButtons();
                    handleGradientColorChange();
                }
            }
        }
        
        // 更新渐变按钮状态
        function updateGradientButtons() {
            const visibleColors = document.querySelectorAll('.gradient-color-item:not([style*="display: none"])');
            // 计算实际颜色数量（减去添加按钮）
            const colorCount = Array.from(visibleColors).filter(item => 
                !item.querySelector('#addColorBtn')
            ).length;
            
            // 获取添加按钮的父容器
            const addColorItem = document.querySelector('.gradient-color-item:has(#addColorBtn)');
            
            // 当有4个颜色时隐藏整个添加按钮容器，否则显示
            if (colorCount >= 4) {
                addColorItem.style.display = 'none';
            } else {
                addColorItem.style.display = 'flex';
                addColorBtn.style.display = 'flex';
            }
            
            // 更新每个移除颜色按钮的状态
            // 前两个颜色（必须保留）的移除按钮始终禁用
            const removeButtons = document.querySelectorAll('.remove-color-btn');
            removeButtons.forEach((btn, index) => {
                // 索引为0和1的按钮始终禁用
                btn.disabled = index < 2;
            });
        }
        
        // 事件监听
        trailEnabled.addEventListener('change', updateSettings);
        trailWidth.addEventListener('input', updateSettings);
        trailOpacity.addEventListener('input', updateSettings);
        trailFadeTime.addEventListener('input', updateSettings);
        trailColor.addEventListener('input', updateSettings);
        
        // 渐变长度和过渡事件
        gradientLength.addEventListener('input', updateSettings);
        gradientTransition.addEventListener('input', updateSettings);
        
        // 模式切换事件
        modeSingle.addEventListener('change', handleModeChange);
        modeGradient.addEventListener('change', handleModeChange);
        modePreset.addEventListener('change', handleModeChange);
        
        // 渐变颜色事件
        document.querySelectorAll('.gradient-color').forEach(colorInput => {
            colorInput.addEventListener('input', handleGradientColorChange);
        });
        
        // 渐变控制按钮事件
        addColorBtn.addEventListener('click', addGradientColor);
        
        // 为每个移除颜色按钮添加事件监听器
        document.querySelectorAll('.remove-color-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const index = parseInt(e.target.dataset.index);
                removeGradientColor(index);
            });
        });
        
        // 自定义下拉框逻辑
        const presetDropdown = document.getElementById('presetDropdown');
        const dropdownSelected = document.getElementById('dropdownSelected');
        const dropdownArrow = document.getElementById('dropdownArrow');
        const dropdownMenu = document.getElementById('dropdownMenu');
        const dropdownItems = document.querySelectorAll('.dropdown-item');
        const selectedPresetText = document.getElementById('selectedPresetText');
        
        // 切换下拉菜单显示/隐藏
        dropdownSelected.addEventListener('click', () => {
            dropdownMenu.classList.toggle('open');
            dropdownArrow.classList.toggle('open');
        });
        
        // 点击选项
        dropdownItems.forEach(item => {
            item.addEventListener('click', () => {
                const value = item.dataset.value;
                const text = item.textContent;
                
                // 更新选中的值
                selectedPresetText.textContent = text;
                presetSelect.value = value;
                
                // 更新选中状态
                dropdownItems.forEach(i => i.classList.remove('selected'));
                item.classList.add('selected');
                
                // 关闭下拉菜单
                dropdownMenu.classList.remove('open');
                dropdownArrow.classList.remove('open');
                
                // 更新设置
                trailSettings.preset = parseInt(value);
                updateSettings();
            });
        });
        
        // 点击外部关闭下拉菜单
        document.addEventListener('click', (e) => {
            if (!presetDropdown.contains(e.target)) {
                dropdownMenu.classList.remove('open');
                dropdownArrow.classList.remove('open');
            }
        });
        
        // 加载保存的配置
        ipcRenderer.on('load-config', (event, config) => {
            // 更新轨迹设置
            trailSettings = config;
            
            // 更新UI元素
            trailEnabled.checked = config.enabled;
            trailWidth.value = config.width;
            trailOpacity.value = config.opacity;
            trailFadeTime.value = config.fadeTime;
            trailColor.value = config.color;
            gradientLength.value = config.gradientLength || 100;
            gradientTransition.value = config.gradientTransition || 0.5;
            
            // 更新显示值
            trailWidthValue.textContent = config.width;
            trailOpacityValue.textContent = config.opacity;
            trailFadeTimeValue.textContent = config.fadeTime;
            gradientLengthValue.textContent = config.gradientLength || 100;
            gradientTransitionValue.textContent = config.gradientTransition || 0.5;
            updateColorDisplay();
            
            // 更新渐变颜色
            if (config.gradientColors) {
                trailSettings.gradientColors = config.gradientColors;
                
                // 更新渐变颜色输入框
                const colorInputs = document.querySelectorAll('.gradient-color');
                colorInputs.forEach((input, index) => {
                    if (config.gradientColors[index]) {
                        input.value = config.gradientColors[index];
                        // 显示对应的颜色输入框
                        const parent = input.closest('.gradient-color-item');
                        if (parent) {
                            parent.style.display = 'flex';
                        }
                    }
                });
                
                // 更新按钮状态
                updateGradientButtons();
            }
            
            // 更新预设选择
            const presetValue = config.preset || 0;
            presetSelect.value = presetValue;
            trailSettings.preset = presetValue;
            
            // 更新自定义下拉框
            const dropdownItems = document.querySelectorAll('.dropdown-item');
            dropdownItems.forEach(item => {
                if (item.dataset.value === presetValue.toString()) {
                    item.classList.add('selected');
                    document.getElementById('selectedPresetText').textContent = item.textContent;
                } else {
                    item.classList.remove('selected');
                }
            });
            
            // 更新模式
            document.querySelector(`input[name="trailMode"][value="${config.mode}"]`).checked = true;
            handleModeChange();
            
            // 更新轨迹
            drawSmoothTrail();
        });
        
        // 窗口控制按钮事件
        minimizeBtn.addEventListener('click', () => {
            ipcRenderer.send('minimize-window');
        });
        
        closeBtn.addEventListener('click', () => {
            ipcRenderer.send('close-window');
        });
        
        // 初始化设置
        updateGradientButtons();
        updateSettings();
    </script>
</body>
</html>
