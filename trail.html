<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全局鼠标轨迹</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            overflow: hidden;
            background: transparent;
            user-select: none;
            cursor: none;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 9999;
        }
    </style>
</head>

<body>
    <canvas id="trailCanvas"></canvas>

    <script>
        const { ipcRenderer } = require('electron');

        // 获取canvas元素和上下文
        const canvas = document.getElementById('trailCanvas');
        const ctx = canvas.getContext('2d');

        // 设置画布大小
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        // 初始化画布大小
        resizeCanvas();

        // 监听窗口大小变化
        window.addEventListener('resize', resizeCanvas);

        // 轨迹配置
        let config = {
            enabled: true,
            length: 20,
            mode: 'single', // 模式：single, gradient, preset
            width: 5,
            opacity: 0.8,
            fadeTime: 1000, // 停留时间（毫秒）
            color: '#ff0000', // 单色模式颜色
            gradientColors: ['#ff0000', '#00ff00'], // 渐变模式颜色
            preset: 0, // 预设模式模板索引
            gradientLength: 100, // 渐变长度
            gradientTransition: 0.5 // 渐变过渡程度（0-1）
        };

        // 轨迹点数组
        let trailPoints = [];
        let animationFrameId = null;
        let lastMouseMoveTime = 0;
        let totalPointsGenerated = 0; // 用于跟踪生成的点的总数，确保颜色序列一致

        // 监听配置更新
        ipcRenderer.on('update-config', (event, newConfig) => {
            config = { ...config, ...newConfig };
        });

        // 监听开关状态
        ipcRenderer.on('toggle-trail', (event, enabled) => {
            config.enabled = enabled;
            if (!enabled) {
                // 清空轨迹
                trailPoints = [];
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                if (animationFrameId) {
                    cancelAnimationFrame(animationFrameId);
                    animationFrameId = null;
                }
            }
        });

        // 上一个鼠标位置
        let lastMousePos = null;
        
        // 鼠标移动事件
        document.addEventListener('mousemove', (e) => {
            if (!config.enabled) return;

            // 递增总生成点计数
            totalPointsGenerated++;
            
            // 为当前点计算固定颜色
            const pointColor = calculateFixedColor();

            const currentPos = {
                x: e.clientX,
                y: e.clientY,
                createdAt: Date.now(),
                color: pointColor // 为当前点分配固定颜色
            };

            // 添加当前点
            trailPoints.push(currentPos);
            
            // 如果有上一个位置，且距离较远，添加中间点以确保轨迹连续
            if (lastMousePos) {
                const dx = currentPos.x - lastMousePos.x;
                const dy = currentPos.y - lastMousePos.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                // 如果距离大于10像素，添加中间点
                const maxDistance = 10;
                if (distance > maxDistance) {
                    const steps = Math.ceil(distance / maxDistance);
                    const stepX = dx / steps;
                    const stepY = dy / steps;
                    
                    // 添加中间点
                    for (let i = 1; i < steps; i++) {
                        // 递增总生成点计数
                        totalPointsGenerated++;
                        
                        // 为每个中间点也分配固定颜色
                        const intermediateColor = calculateFixedColor();
                        trailPoints.push({
                            x: lastMousePos.x + stepX * i,
                            y: lastMousePos.y + stepY * i,
                            createdAt: Date.now(),
                            color: intermediateColor // 为中间点分配固定颜色
                        });
                    }
                }
            }
            
            // 更新上一个位置
            lastMousePos = currentPos;
        });
        
        // 计算轨迹点的固定颜色，在创建时分配，不再改变
        function calculateFixedColor() {
            if (config.mode !== 'gradient' || !config.gradientColors || config.gradientColors.length < 2) {
                return config.color;
            }
            
            // 使用总生成点计数和渐变长度来计算颜色位置
            // gradientLength 控制颜色循环的速度，值越大，颜色变化越慢
            const normalizedPosition = (totalPointsGenerated / config.gradientLength) % 1;
            
            // 计算颜色索引
            const colorIndex = Math.floor(normalizedPosition * (config.gradientColors.length - 1));
            const nextColorIndex = Math.min(colorIndex + 1, config.gradientColors.length - 1);
            
            // 计算区间内的相对位置
            let intervalPosition = (normalizedPosition * (config.gradientColors.length - 1)) - colorIndex;
            
            // 使用 gradientTransition 来调整过渡效果
            // 0: 硬过渡，1: 平滑过渡
            if (config.gradientTransition > 0) {
                // 使用缓动函数调整过渡曲线
                intervalPosition = easeInOutCubic(intervalPosition, config.gradientTransition);
            }
            
            // 获取起始颜色和结束颜色
            const startColor = hexToRgb(config.gradientColors[colorIndex]);
            const endColor = hexToRgb(config.gradientColors[nextColorIndex]);
            
            // 线性插值计算当前颜色
            const r = Math.round(startColor.r + (endColor.r - startColor.r) * intervalPosition);
            const g = Math.round(startColor.g + (endColor.g - startColor.g) * intervalPosition);
            const b = Math.round(startColor.b + (endColor.b - startColor.b) * intervalPosition);
            
            // 转换回十六进制格式
            return rgbToHex(r, g, b);
        }
        
        // 缓动函数，用于调整渐变过渡效果
        function easeInOutCubic(t, transition) {
            // transition 值越大，过渡越平滑
            const smoothness = 1 + transition * 3;
            return t < 0.5 
                ? Math.pow(2 * t, smoothness) / 2 
                : 1 - Math.pow(-2 * t + 2, smoothness) / 2;
        }
        
        // 连续动画循环，持续更新轨迹
        function animateTrail() {
            cleanupOldPoints();
            drawTrail();
            requestAnimationFrame(animateTrail);
        }
        
        // 定期清理过期的轨迹点
        // 实现固定速度淡化：同样长的时间内只能淡化同样长度的轨迹，不受鼠标移动速度影响
        function cleanupOldPoints() {
            const timeInterval = 50; // 清理间隔（毫秒）
            
            // 计算淡化速度：根据用户设置的停留时间，确保轨迹在设定时间内完全淡化
            // 使用当前轨迹点数量和停留时间计算每秒应淡化的点数
            const fadeSpeed = trailPoints.length / (config.fadeTime / 1000);
            
            // 计算在当前时间间隔内应该淡化的点数量
            const pointsToRemove = Math.max(1, Math.floor(fadeSpeed * timeInterval / 1000));
            
            // 如果有足够的点，按固定速度移除最老的点
            if (trailPoints.length > pointsToRemove) {
                // 按创建时间排序，确保最老的点在前面
                trailPoints.sort((a, b) => a.createdAt - b.createdAt);
                // 移除最老的点
                trailPoints = trailPoints.slice(pointsToRemove);
            } else if (trailPoints.length > 0) {
                // 如果点数不足，清空所有点
                trailPoints = [];
            }
        }
        
        // 启动动画循环
        animateTrail();

        // 绘制平滑轨迹（使用贝塞尔曲线）
        function drawTrail() {
            if (!config.enabled || trailPoints.length < 2) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                return;
            }

            // 清空画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 按创建时间排序轨迹点，确保顺序正确（最早的点在前面，最新的点在后面）
            const sortedPoints = [...trailPoints].sort((a, b) => a.createdAt - b.createdAt);
            
            if (sortedPoints.length < 2) {
                return;
            }
            
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = config.width; // 使用固定宽度，不随时间变化
            
            // 遍历所有点，绘制从尾部到头部的渐变轨迹
            for (let i = 0; i < sortedPoints.length - 1; i++) {
                // 计算当前线段在轨迹中的位置比例（从尾部到头部）
                // i = 0 是最老的点（尾部），i = sortedPoints.length - 2 是最新的点（头部）
                const trailProgress = i / (sortedPoints.length - 1);
                
                // 计算当前线段的透明度：尾部完全透明，头部完全不透明
                const alpha = config.opacity * trailProgress;
                
                // 跳过几乎透明的线段
                if (alpha < 0.05) continue;
                
                // 获取线段的固定颜色（从点对象中获取）
                const point1 = sortedPoints[i];
                const point2 = sortedPoints[i + 1];
                const segmentColor = point2.color || config.color; // 使用当前点的固定颜色
                
                // 设置当前线段的样式
                ctx.strokeStyle = `${segmentColor}${Math.floor(alpha * 255).toString(16).padStart(2, '0')}`;
                
                // 绘制当前线段
                ctx.beginPath();
                
                ctx.moveTo(point1.x, point1.y);
                
                if (i < sortedPoints.length - 2) {
                    // 不是最后一个线段，使用贝塞尔曲线
                    const next = sortedPoints[i + 2];
                    
                    // 计算控制点，实现平滑曲线
                    const tension = 0.5;
                    const cp1x = point2.x - (next.x - point1.x) * tension;
                    const cp1y = point2.y - (next.y - point1.y) * tension;
                    const cp2x = point2.x + (next.x - point1.x) * tension;
                    const cp2y = point2.y + (next.y - point1.y) * tension;
                    
                    ctx.bezierCurveTo(point2.x, point2.y, cp2x, cp2y, next.x, next.y);
                } else {
                    // 最后一个线段，直接连线
                    ctx.lineTo(point2.x, point2.y);
                }
                
                ctx.stroke();
            }
        }
        
        // 根据渐变颜色数组和位置计算当前颜色
        function getGradientColor(gradientColors, position) {
            if (!gradientColors || gradientColors.length < 2) {
                return gradientColors[0] || '#ff0000';
            }
            
            // 计算当前位置落在哪个颜色区间
            const colorIndex = Math.floor(position * (gradientColors.length - 1));
            const nextColorIndex = Math.min(colorIndex + 1, gradientColors.length - 1);
            
            // 计算在当前区间内的相对位置
            const intervalPosition = (position * (gradientColors.length - 1)) - colorIndex;
            
            // 获取起始颜色和结束颜色
            const startColor = hexToRgb(gradientColors[colorIndex]);
            const endColor = hexToRgb(gradientColors[nextColorIndex]);
            
            // 线性插值计算当前颜色
            const r = Math.round(startColor.r + (endColor.r - startColor.r) * intervalPosition);
            const g = Math.round(startColor.g + (endColor.g - startColor.g) * intervalPosition);
            const b = Math.round(startColor.b + (endColor.b - startColor.b) * intervalPosition);
            
            // 转换回十六进制格式
            return rgbToHex(r, g, b);
        }
        
        // 十六进制颜色转RGB
        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : { r: 255, g: 0, b: 0 };
        }
        
        // RGB颜色转十六进制
        function rgbToHex(r, g, b) {
            return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
        }
    </script>
</body>

</html>
