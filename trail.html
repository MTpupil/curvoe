<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全局鼠标轨迹</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            overflow: hidden;
            background: transparent;
            user-select: none;
            cursor: none;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 9999;
        }
    </style>
</head>

<body>
    <canvas id="trailCanvas"></canvas>

    <script>
        const { ipcRenderer } = require('electron');

        // 获取canvas元素和上下文
        const canvas = document.getElementById('trailCanvas');
        const ctx = canvas.getContext('2d');

        // 设置画布大小
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        // 初始化画布大小
        resizeCanvas();

        // 监听窗口大小变化
        window.addEventListener('resize', resizeCanvas);

        // 预设样式配置
        const presets = [
            {
                name: '马卡龙浅彩',
                mode: 'gradient',
                gradientColors: ['#FFE6EF', '#FFD9B3', '#FFF4C2', '#C2F0E1', '#FFCCD5', '#CCE5FF' ,'#E5CCFF'], 
                width: 3,
                opacity: 0.8,
                fadeTime: 1500,
                gradientLength: 150,
                gradientTransition: 0.8
            },
            {
                name: '马卡龙浅彩发光',
                mode: 'gradient',
                gradientColors: ['#FFE6EF', '#FFD9B3', '#FFF4C2', '#C2F0E1', '#FFCCD5', '#CCE5FF' ,'#E5CCFF'], 
                width: 3,
                opacity: 0.9,
                fadeTime: 1500,
                gradientLength: 150,
                gradientTransition: 0.8,
                glow: true,
                glowBlur: 1,
                glowOpacity: 0.2
            },
            {
                name: '帕斯蒂尔水彩',
                mode: 'gradient',
                gradientColors: [
                    '#FFE4E6', '#FFD9B3', '#FFF8D6', '#E1F5D0', '#D4F1F9', '#E8E4F1', 
                    '#F9E4D0', '#D0E8E1', '#F4D9EB', '#E4F4D0', '#D9E4F9', '#F4E4D9',
                    '#E0F7FA', '#F3E5F5', '#FFF3E0', '#E8F5E8', '#E3F2FD', '#FFF8E1'
                ], // 18种颜色，包含马卡龙和莫兰迪色系
                width: 4,
                opacity: 0.85,
                fadeTime: 2000,
                gradientLength: 300, // 更长的渐变长度，实现水彩晕染效果
                gradientTransition: 0.95, // 更平滑的过渡
                glow: true,
                glowBlur: 1.5,
                glowOpacity: 0.3
            },
            {
                name: '棉花糖',
                mode: 'gradient',
                gradientColors: [
                    '#FFE8F0', '#FFF0E8', '#FFF8E8', '#F0FFF8', '#E8F8FF', '#E8F0FF', '#F0E8FF', '#FFE8F8' // 粉、蓝、黄为主的低饱和度高亮度颜色
                ], // 8种颜色，营造棉花糖的蓬松感
                width: 6, // 更粗的线条，增强蓬松感
                opacity: 0.95, // 更高的透明度，增强轻盈感
                fadeTime: 1800,
                gradientLength: 200, // 合适的渐变长度
                gradientTransition: 0.9, // 平滑过渡
                glow: true,
                glowBlur: 3, // 更强的发光效果，增强蓬松感
                glowOpacity: 0.4 // 更高的发光透明度
            },
            {
                name: '日落',
                mode: 'gradient',
                gradientColors: [
                    '#FFE0B2', '#FFCCBC', '#FFAB91', '#FFD1DC', '#F8BBD0', '#E1BEE7', '#D1C4E9' // 浅橙、浅粉、浅紫为主，饱和度稍高
                ], // 7种颜色，模拟日落时的柔和淡彩
                width: 4, // 指定的线条宽度
                opacity: 0.9, // 暖调通透感
                fadeTime: 1800,
                gradientLength: 250, // 合适的渐变长度
                gradientTransition: 0.9, // 平滑过渡
                glow: false // 不添加特殊效果
            },
            {
                name: '糖果派对',
                mode: 'gradient',
                gradientColors: ['#FF3E5E', '#7B66FF', '#FFE619', '#33FFD8'], // 草莓红 + 蓝莓紫 + 柠檬黄 + 薄荷绿
                width: 4,
                opacity: 0.9,
                fadeTime: 1500,
                gradientLength: 500,
                gradientTransition: 0.8,
                glow: true,
                glowBlur: 2,
                glowOpacity: 0.3
            },
            {
                name: '赛博霓虹',
                mode: 'gradient',
                gradientColors: ['#FF2D95', '#00F0FF', '#B300FF', '#FF7700'], // 霓虹粉 + 电蓝 + 荧光紫 + 荧光橙
                width: 4,
                opacity: 0.9,
                fadeTime: 1500,
                gradientLength: 500,
                gradientTransition: 0.8,
                glow: true,
                glowBlur: 3,
                glowOpacity: 0.5
            }
        ];

        // 轨迹配置
        let config = {
            enabled: true,
            length: 20,
            mode: 'single', // 模式：single, gradient, preset
            width: 5,
            opacity: 0.8,
            fadeTime: 1000, // 停留时间（毫秒）
            color: '#ff0000', // 单色模式颜色
            gradientColors: ['#ff0000', '#00ff00'], // 渐变模式颜色
            preset: 0, // 预设模式模板索引
            gradientLength: 100, // 渐变长度
            gradientTransition: 0.5, // 渐变过渡程度（0-1）
            shortcutEnabled: true, // 快捷键开关
            screenshotEnabled: true, // 截图显示开关
            visible: true // 当前轨迹是否可见（用于快捷键和截图）
        };

        // 轨迹点数组
        let trailPoints = [];
        let animationFrameId = null;
        let lastMouseMoveTime = 0;
        let totalPointsGenerated = 0; // 用于跟踪生成的点的总数，确保颜色序列一致

        // 监听配置更新
        ipcRenderer.on('update-config', (event, newConfig) => {
            config = { ...config, ...newConfig };
        });

        // 监听开关状态
        ipcRenderer.on('toggle-trail', (event, enabled) => {
            config.enabled = enabled;
            if (!enabled) {
                // 清空轨迹
                trailPoints = [];
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                if (animationFrameId) {
                    cancelAnimationFrame(animationFrameId);
                    animationFrameId = null;
                }
            }
        });

        // 监听快捷键事件 - 现在由主进程处理，这里只需要响应配置更新
        ipcRenderer.on('toggle-trail-shortcut', () => {
            console.log('Trail window received toggle-trail-shortcut event');
            // 主进程会直接销毁和重建窗口，这里不需要处理
        });
        
        // 实现截图检测和处理 - 只清空画布，不动透明层
        let isScreenshotActive = false;
        
        // 快速清空画布功能
        function fastClearCanvas() {
            console.log('Fast clearing canvas due to screenshot detection');
            // 清空画布，不影响透明层窗口
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // 清空轨迹点数组
            trailPoints = [];
        }
        
        // 检测截图操作
        function detectScreenshot() {
            // 监听常见截图快捷键
            const screenshotKeyPatterns = [
                // 系统截图快捷键
                { key: 'PrintScreen' },
                { key: 'PrtScr' },
                { key: 'F11' },
                
                // 微信/QQ截图
                { key: 'A', ctrlKey: true, shiftKey: true },
                
                // Snipaste
                { key: 'P', ctrlKey: true, altKey: true },
                
                // Windows 10+ 截图工具
                { key: 'S', winKey: true, shiftKey: true },
                
                // macOS截图
                { key: '3', metaKey: true },
                { key: '4', metaKey: true },
                { key: '5', metaKey: true },
                
                // 其他常见组合
                { key: 'Insert', ctrlKey: true },
                { key: 'S', ctrlKey: true, shiftKey: true },
                { key: 'A', altKey: true, shiftKey: true }
            ];
            
            // 键盘事件监听
            document.addEventListener('keydown', (e) => {
                // 检查是否匹配任何截图快捷键模式
                const isScreenshotKey = screenshotKeyPatterns.some(pattern => {
                    return e.key === pattern.key &&
                           e.ctrlKey === !!pattern.ctrlKey &&
                           e.altKey === !!pattern.altKey &&
                           e.shiftKey === !!pattern.shiftKey &&
                           e.metaKey === !!pattern.metaKey &&
                           e.winKey === !!pattern.winKey;
                });
                
                if (isScreenshotKey) {
                    console.log('Screenshot key detected:', e.key, e.ctrlKey, e.altKey, e.shiftKey);
                    fastClearCanvas();
                }
            });
            
            // 窗口焦点检测
            let lastFocusTime = Date.now();
            let focusLossCount = 0;
            
            // 监听窗口失焦事件
            window.addEventListener('blur', () => {
                const currentTime = Date.now();
                const timeSinceLastFocus = currentTime - lastFocusTime;
                
                // 短时间内多次失焦可能是截图工具在激活
                if (timeSinceLastFocus < 1000) {
                    focusLossCount++;
                    if (focusLossCount >= 2) {
                        console.log('Multiple focus losses detected, assuming screenshot');
                        fastClearCanvas();
                        focusLossCount = 0;
                    }
                } else {
                    focusLossCount = 1;
                }
                
                lastFocusTime = currentTime;
            });
            
            // 监听窗口重新获得焦点事件
            window.addEventListener('focus', () => {
                focusLossCount = 0;
            });
            
            // 鼠标事件异常检测
            let lastMouseMoveTime = Date.now();
            let mouseStationaryCount = 0;
            
            document.addEventListener('mousemove', () => {
                lastMouseMoveTime = Date.now();
                mouseStationaryCount = 0;
            });
            
            // 定期检查鼠标是否长时间不动
            setInterval(() => {
                const timeSinceLastMove = Date.now() - lastMouseMoveTime;
                if (timeSinceLastMove > 1000 && timeSinceLastMove < 5000) {
                    mouseStationaryCount++;
                    if (mouseStationaryCount >= 3) {
                        console.log('Mouse stationary detected, possible screenshot in progress');
                        fastClearCanvas();
                        mouseStationaryCount = 0;
                    }
                } else {
                    mouseStationaryCount = 0;
                }
            }, 500);
        }
        
        // 初始化截图检测
        detectScreenshot();

        // 上一个鼠标位置
        let lastMousePos = null;
        
        // 鼠标移动事件
        document.addEventListener('mousemove', (e) => {
            if (!config.enabled || !config.visible) return;

            const currentPos = {
                x: e.clientX,
                y: e.clientY,
                createdAt: Date.now()
            };

            // 递增总生成点计数
            totalPointsGenerated++;
            
            // 为当前点计算固定颜色
            currentPos.color = calculateFixedColor();

            // 添加当前点
            trailPoints.push(currentPos);
            
            // 如果有上一个位置，添加更多中间点以确保轨迹连续，尤其是快速移动时
            if (lastMousePos) {
                const dx = currentPos.x - lastMousePos.x;
                const dy = currentPos.y - lastMousePos.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                // 动态调整最大距离，速度越快，点越密集
                const maxDistance = 5; // 减小最大距离，增加点密度
                if (distance > maxDistance) {
                    const steps = Math.ceil(distance / maxDistance);
                    const stepX = dx / steps;
                    const stepY = dy / steps;
                    
                    // 添加中间点
                    for (let i = 1; i < steps; i++) {
                        // 递增总生成点计数
                        totalPointsGenerated++;
                        
                        // 为每个中间点也分配固定颜色
                        const intermediateColor = calculateFixedColor();
                        trailPoints.push({
                            x: lastMousePos.x + stepX * i,
                            y: lastMousePos.y + stepY * i,
                            createdAt: Date.now(),
                            color: intermediateColor // 为中间点分配固定颜色
                        });
                    }
                }
            }
            
            // 更新上一个位置
            lastMousePos = currentPos;
        });
        
        // 计算轨迹点的固定颜色，在创建时分配，不再改变
        function calculateFixedColor() {
            let effectiveConfig = config;
            
            // 如果是预设模式，使用预设配置
            if (config.mode === 'preset') {
                const preset = presets[config.preset] || presets[0];
                effectiveConfig = { ...config, ...preset };
            }
            
            if (effectiveConfig.mode !== 'gradient' || !effectiveConfig.gradientColors || effectiveConfig.gradientColors.length < 2) {
                return effectiveConfig.color;
            }
            
            // 使用总生成点计数和渐变长度来计算颜色位置
            // gradientLength 控制颜色循环的速度，值越大，颜色变化越慢
            const normalizedPosition = (totalPointsGenerated / effectiveConfig.gradientLength) % 1;
            
            // 计算颜色索引
            const colorIndex = Math.floor(normalizedPosition * (effectiveConfig.gradientColors.length - 1));
            const nextColorIndex = Math.min(colorIndex + 1, effectiveConfig.gradientColors.length - 1);
            
            // 计算区间内的相对位置
            let intervalPosition = (normalizedPosition * (effectiveConfig.gradientColors.length - 1)) - colorIndex;
            
            // 使用 gradientTransition 来调整过渡效果
            // 0: 硬过渡，1: 平滑过渡
            if (effectiveConfig.gradientTransition > 0) {
                // 使用缓动函数调整过渡曲线
                intervalPosition = easeInOutCubic(intervalPosition, effectiveConfig.gradientTransition);
            }
            
            // 获取起始颜色和结束颜色
            const startColor = hexToRgb(effectiveConfig.gradientColors[colorIndex]);
            const endColor = hexToRgb(effectiveConfig.gradientColors[nextColorIndex]);
            
            // 线性插值计算当前颜色
            const r = Math.round(startColor.r + (endColor.r - startColor.r) * intervalPosition);
            const g = Math.round(startColor.g + (endColor.g - startColor.g) * intervalPosition);
            const b = Math.round(startColor.b + (endColor.b - startColor.b) * intervalPosition);
            
            // 转换回十六进制格式
            return rgbToHex(r, g, b);
        }
        
        // 缓动函数，用于调整渐变过渡效果
        function easeInOutCubic(t, transition) {
            // transition 值越大，过渡越平滑
            const smoothness = 1 + transition * 3;
            return t < 0.5 
                ? Math.pow(2 * t, smoothness) / 2 
                : 1 - Math.pow(-2 * t + 2, smoothness) / 2;
        }
        
        // 连续动画循环，持续更新轨迹
        function animateTrail() {
            cleanupOldPoints();
            drawTrail();
            requestAnimationFrame(animateTrail);
        }
        
        // 定期清理过期的轨迹点
        // 实现固定速度淡化：同样长的时间内只能淡化同样长度的轨迹，不受鼠标移动速度影响
        function cleanupOldPoints() {
            const timeInterval = 50; // 清理间隔（毫秒）
            
            // 如果是预设模式，使用预设的fadeTime
            let effectiveFadeTime = config.fadeTime;
            if (config.mode === 'preset') {
                const preset = presets[config.preset] || presets[0];
                effectiveFadeTime = preset.fadeTime;
            }
            
            // 计算淡化速度：根据用户设置的停留时间，确保轨迹在设定时间内完全淡化
            // 使用当前轨迹点数量和停留时间计算每秒应淡化的点数
            const fadeSpeed = trailPoints.length / (effectiveFadeTime / 1000);
            
            // 计算在当前时间间隔内应该淡化的点数量
            const pointsToRemove = Math.max(1, Math.floor(fadeSpeed * timeInterval / 1000));
            
            // 如果有足够的点，按固定速度移除最老的点
            if (trailPoints.length > pointsToRemove) {
                // 按创建时间排序，确保最老的点在前面
                trailPoints.sort((a, b) => a.createdAt - b.createdAt);
                // 移除最老的点
                trailPoints = trailPoints.slice(pointsToRemove);
            } else if (trailPoints.length > 0) {
                // 如果点数不足，清空所有点
                trailPoints = [];
            }
        }
        
        // 启动动画循环
        animateTrail();

        // Catmull-Rom 曲线转贝塞尔曲线的辅助函数
        function catmullRomToBezier(p0, p1, p2, p3, tension = 0.5) {
            const t = tension;
            const cp1x = p1.x + (p2.x - p0.x) * t * 0.5;
            const cp1y = p1.y + (p2.y - p0.y) * t * 0.5;
            const cp2x = p2.x - (p3.x - p1.x) * t * 0.5;
            const cp2y = p2.y - (p3.y - p1.y) * t * 0.5;
            return { cp1x, cp1y, cp2x, cp2y };
        }

        // 绘制平滑轨迹（使用Catmull-Rom曲线和抗锯齿）
        function drawTrail() {
            if (!config.enabled || !config.visible || trailPoints.length < 2) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                return;
            }

            // 清空画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 按创建时间排序轨迹点，确保顺序正确（最早的点在前面，最新的点在后面）
            const sortedPoints = [...trailPoints].sort((a, b) => a.createdAt - b.createdAt);
            
            if (sortedPoints.length < 2) {
                return;
            }
            
            // 获取当前预设配置
            let currentPreset = null;
            if (config.mode === 'preset') {
                currentPreset = presets[config.preset] || presets[0];
            }
            
            // 如果是预设模式，使用预设的宽度
            let effectiveWidth = config.width;
            if (currentPreset) {
                effectiveWidth = currentPreset.width;
            }
            
            // 如果是预设模式，使用预设的透明度
            let effectiveOpacity = config.opacity;
            if (currentPreset) {
                effectiveOpacity = currentPreset.opacity;
            }
            
            // 如果是预设模式，使用预设的fadeTime
            let effectiveFadeTime = config.fadeTime;
            if (currentPreset) {
                effectiveFadeTime = currentPreset.fadeTime;
            }
            
            // 检查是否需要发光效果
            const shouldGlow = currentPreset && currentPreset.glow;
            const glowWidth = currentPreset ? (currentPreset.glowBlur || 2) * 2 : 4;
            const glowOpacity = currentPreset ? currentPreset.glowOpacity || 0.5 : 0.5;
            
            // 启用高质量抗锯齿和图像平滑
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            
            // 设置画布缩放，提高绘制精度
            const scale = window.devicePixelRatio || 1;
            ctx.scale(scale, scale);
            
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            // 获取当前时间
            const currentTime = Date.now();
            
            // 优化：只绘制一次轨迹，通过分层绘制实现发光效果
            // 1. 首先绘制发光效果（如果需要），使用较宽的线条和半透明颜色
            if (shouldGlow) {
                // 绘制发光效果，使用更高效的方式：宽线条 + 半透明
                ctx.save();
                ctx.lineWidth = (effectiveWidth + glowWidth) * scale;
                
                for (let i = 0; i < sortedPoints.length - 1; i++) {
                    // 使用时间计算透明度，而不是位置比例
                    const pointAge = currentTime - sortedPoints[i + 1].createdAt;
                    const ageRatio = pointAge / effectiveFadeTime;
                    const trailProgress = 1 - Math.max(0, Math.min(1, ageRatio));
                    const alpha = effectiveOpacity * trailProgress * glowOpacity;
                    
                    if (alpha < 0.05) continue;
                    
                    const point1 = sortedPoints[i];
                    const point2 = sortedPoints[i + 1];
                    const segmentColor = point2.color || config.color;
                    
                    ctx.strokeStyle = `${segmentColor}${Math.floor(alpha * 255).toString(16).padStart(2, '0')}`;
                    
                    ctx.beginPath();
                    ctx.moveTo(point1.x * scale, point1.y * scale);
                    
                    // 简化：对于发光效果，使用直线连接，减少计算复杂度
                    ctx.lineTo(point2.x * scale, point2.y * scale);
                    ctx.stroke();
                }
                
                ctx.restore();
            }
            
            // 2. 绘制原始轨迹，使用正常宽度和不透明颜色
            ctx.lineWidth = effectiveWidth * scale;
            
            for (let i = 0; i < sortedPoints.length - 1; i++) {
                // 使用时间计算透明度，而不是位置比例
                const pointAge = currentTime - sortedPoints[i + 1].createdAt;
                const ageRatio = pointAge / effectiveFadeTime;
                const trailProgress = 1 - Math.max(0, Math.min(1, ageRatio));
                const alpha = effectiveOpacity * trailProgress;
                
                // 跳过几乎透明的线段
                if (alpha < 0.05) continue;
                
                // 获取当前和下一个点
                const point1 = sortedPoints[i];
                const point2 = sortedPoints[i + 1];
                const segmentColor = point2.color || config.color;
                
                // 设置当前线段的样式
                ctx.strokeStyle = `${segmentColor}${Math.floor(alpha * 255).toString(16).padStart(2, '0')}`;
                
                ctx.beginPath();
                ctx.moveTo(point1.x * scale, point1.y * scale);
                
                // 对于点数量较少的情况，使用简单的平滑处理
                if (sortedPoints.length < 3) {
                    ctx.lineTo(point2.x * scale, point2.y * scale);
                } else if (i === 0) {
                    // 第一个线段，使用二次贝塞尔曲线
                    const nextPoint = sortedPoints[i + 2];
                    const cp1x = point1.x + (point2.x - point1.x) * 0.5;
                    const cp1y = point1.y + (point2.y - point1.y) * 0.5;
                    ctx.quadraticCurveTo(
                        cp1x * scale, cp1y * scale, 
                        point2.x * scale, point2.y * scale
                    );
                } else if (i < sortedPoints.length - 2) {
                    // 中间线段，使用Catmull-Rom曲线转贝塞尔曲线
                    const prevPoint = sortedPoints[i - 1];
                    const nextPoint = sortedPoints[i + 2];
                    
                    const { cp1x, cp1y, cp2x, cp2y } = catmullRomToBezier(
                        prevPoint, point1, point2, nextPoint, 0.9 // 更高的张力值
                    );
                    
                    ctx.bezierCurveTo(
                        cp1x * scale, cp1y * scale, 
                        cp2x * scale, cp2y * scale, 
                        point2.x * scale, point2.y * scale
                    );
                } else {
                    // 最后一个线段，使用二次贝塞尔曲线
                    const prevPoint = sortedPoints[i - 1];
                    const cp1x = point2.x - (point2.x - prevPoint.x) * 0.5;
                    const cp1y = point2.y - (point2.y - prevPoint.y) * 0.5;
                    ctx.quadraticCurveTo(
                        cp1x * scale, cp1y * scale, 
                        point2.x * scale, point2.y * scale
                    );
                }
                
                ctx.stroke();
            }
            
            // 恢复原始缩放
            ctx.scale(1/scale, 1/scale);
        }
        
        // 根据渐变颜色数组和位置计算当前颜色
        function getGradientColor(gradientColors, position) {
            if (!gradientColors || gradientColors.length < 2) {
                return gradientColors[0] || '#ff0000';
            }
            
            // 计算当前位置落在哪个颜色区间
            const colorIndex = Math.floor(position * (gradientColors.length - 1));
            const nextColorIndex = Math.min(colorIndex + 1, gradientColors.length - 1);
            
            // 计算在当前区间内的相对位置
            const intervalPosition = (position * (gradientColors.length - 1)) - colorIndex;
            
            // 获取起始颜色和结束颜色
            const startColor = hexToRgb(gradientColors[colorIndex]);
            const endColor = hexToRgb(gradientColors[nextColorIndex]);
            
            // 线性插值计算当前颜色
            const r = Math.round(startColor.r + (endColor.r - startColor.r) * intervalPosition);
            const g = Math.round(startColor.g + (endColor.g - startColor.g) * intervalPosition);
            const b = Math.round(startColor.b + (endColor.b - startColor.b) * intervalPosition);
            
            // 转换回十六进制格式
            return rgbToHex(r, g, b);
        }
        
        // 十六进制颜色转RGB
        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : { r: 255, g: 0, b: 0 };
        }
        
        // RGB颜色转十六进制
        function rgbToHex(r, g, b) {
            return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
        }
    </script>
