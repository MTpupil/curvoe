<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全局鼠标轨迹</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            overflow: hidden;
            background: transparent;
            user-select: none;
            cursor: none;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 9999;
        }
    </style>
</head>

<body>
    <canvas id="trailCanvas"></canvas>

    <script>
        const { ipcRenderer } = require('electron');

        // 获取canvas元素和上下文
        const canvas = document.getElementById('trailCanvas');
        const ctx = canvas.getContext('2d');

        // 设置画布大小
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        // 初始化画布大小
        resizeCanvas();

        // 监听窗口大小变化
        window.addEventListener('resize', resizeCanvas);

        // 轨迹配置
        let config = {
            enabled: true,
            length: 20,
            width: 5,
            opacity: 0.8,
            fadeTime: 1000, // 停留时间（毫秒）
            color: '#ff0000'
        };

        // 轨迹点数组
        let trailPoints = [];
        let animationFrameId = null;
        let lastMouseMoveTime = 0;

        // 监听配置更新
        ipcRenderer.on('update-config', (event, newConfig) => {
            config = { ...config, ...newConfig };
        });

        // 监听开关状态
        ipcRenderer.on('toggle-trail', (event, enabled) => {
            config.enabled = enabled;
            if (!enabled) {
                // 清空轨迹
                trailPoints = [];
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                if (animationFrameId) {
                    cancelAnimationFrame(animationFrameId);
                    animationFrameId = null;
                }
            }
        });

        // 上一个鼠标位置
        let lastMousePos = null;
        
        // 鼠标移动事件
        document.addEventListener('mousemove', (e) => {
            if (!config.enabled) return;

            const currentPos = {
                x: e.clientX,
                y: e.clientY,
                createdAt: Date.now()
            };

            // 添加当前点
            trailPoints.push(currentPos);
            
            // 如果有上一个位置，且距离较远，添加中间点以确保轨迹连续
            if (lastMousePos) {
                const dx = currentPos.x - lastMousePos.x;
                const dy = currentPos.y - lastMousePos.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                // 如果距离大于10像素，添加中间点
                const maxDistance = 10;
                if (distance > maxDistance) {
                    const steps = Math.ceil(distance / maxDistance);
                    const stepX = dx / steps;
                    const stepY = dy / steps;
                    
                    // 添加中间点
                    for (let i = 1; i < steps; i++) {
                        trailPoints.push({
                            x: lastMousePos.x + stepX * i,
                            y: lastMousePos.y + stepY * i,
                            createdAt: Date.now()
                        });
                    }
                }
            }
            
            // 更新上一个位置
            lastMousePos = currentPos;
        });
        
        // 连续动画循环，持续更新轨迹
        function animateTrail() {
            cleanupOldPoints();
            drawTrail();
            requestAnimationFrame(animateTrail);
        }
        
        // 定期清理过期的轨迹点
        // 实现固定速度淡化：同样长的时间内只能淡化同样长度的轨迹，不受鼠标移动速度影响
        function cleanupOldPoints() {
            const timeInterval = 50; // 清理间隔（毫秒）
            
            // 计算淡化速度：根据用户设置的停留时间，确保轨迹在设定时间内完全淡化
            // 使用当前轨迹点数量和停留时间计算每秒应淡化的点数
            const fadeSpeed = trailPoints.length / (config.fadeTime / 1000);
            
            // 计算在当前时间间隔内应该淡化的点数量
            const pointsToRemove = Math.max(1, Math.floor(fadeSpeed * timeInterval / 1000));
            
            // 如果有足够的点，按固定速度移除最老的点
            if (trailPoints.length > pointsToRemove) {
                // 按创建时间排序，确保最老的点在前面
                trailPoints.sort((a, b) => a.createdAt - b.createdAt);
                // 移除最老的点
                trailPoints = trailPoints.slice(pointsToRemove);
            } else if (trailPoints.length > 0) {
                // 如果点数不足，清空所有点
                trailPoints = [];
            }
        }
        
        // 启动动画循环
        animateTrail();

        // 绘制平滑轨迹（使用贝塞尔曲线）
        function drawTrail() {
            if (!config.enabled || trailPoints.length < 2) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                return;
            }

            // 清空画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 按创建时间排序轨迹点，确保顺序正确（最早的点在前面，最新的点在后面）
            const sortedPoints = [...trailPoints].sort((a, b) => a.createdAt - b.createdAt);
            
            if (sortedPoints.length < 2) {
                return;
            }
            
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = config.width; // 使用固定宽度，不随时间变化
            
            // 遍历所有点，绘制从尾部到头部的渐变轨迹
            for (let i = 0; i < sortedPoints.length - 1; i++) {
                // 计算当前线段在轨迹中的位置比例（从尾部到头部）
                // i = 0 是最老的点（尾部），i = sortedPoints.length - 2 是最新的点（头部）
                const trailProgress = i / (sortedPoints.length - 1);
                
                // 计算当前线段的透明度：尾部完全透明，头部完全不透明
                const alpha = config.opacity * trailProgress;
                
                // 跳过几乎透明的线段
                if (alpha < 0.05) continue;
                
                // 设置当前线段的样式
                ctx.strokeStyle = `${config.color}${Math.floor(alpha * 255).toString(16).padStart(2, '0')}`;
                
                // 绘制当前线段
                ctx.beginPath();
                
                const prev = sortedPoints[i];     // 前一个点（更靠近尾部）
                const curr = sortedPoints[i + 1]; // 当前点（更靠近头部）
                
                ctx.moveTo(prev.x, prev.y);
                
                if (i < sortedPoints.length - 2) {
                    // 不是最后一个线段，使用贝塞尔曲线
                    const next = sortedPoints[i + 2];
                    
                    // 计算控制点，实现平滑曲线
                    const tension = 0.5;
                    const cp1x = curr.x - (next.x - prev.x) * tension;
                    const cp1y = curr.y - (next.y - prev.y) * tension;
                    const cp2x = curr.x + (next.x - prev.x) * tension;
                    const cp2y = curr.y + (next.y - prev.y) * tension;
                    
                    ctx.bezierCurveTo(curr.x, curr.y, cp2x, cp2y, next.x, next.y);
                } else {
                    // 最后一个线段，直接连线
                    ctx.lineTo(curr.x, curr.y);
                }
                
                ctx.stroke();
            }
        }
    </script>
</body>

</html>
